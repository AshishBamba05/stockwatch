databases:
  - name: stocktrackr-db
    plan: free
    databaseName: stocktrackr
    user: stock

services:
  - type: redis
    name: stocktrackr-redis
    plan: free
    ipAllowList: []

  - type: web
    name: abamba-stockwatch-app
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stocktrackr-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: stocktrackr-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
